<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Watch Brand Aggregator</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #0d0d0d;
      --surface:  #161616;
      --border:   #2a2a2a;
      --accent:   #c8a96e;
      --accent2:  #8a6e3e;
      --text:     #e8e8e8;
      --muted:    #888;
      --danger:   #c0392b;
      --green:    #27ae60;
      --row-alt:  #1a1a1a;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    /* ── Header ─────────────────────────────────────────────────────────── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 18px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-left h1 {
      font-size: 1.3rem;
      font-weight: 600;
      letter-spacing: .04em;
      color: var(--accent);
    }

    .header-left p {
      color: var(--muted);
      font-size: .8rem;
      margin-top: 2px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    #status-text { font-size: .78rem; color: var(--muted); }

    button {
      cursor: pointer;
      border: none;
      border-radius: 4px;
      font-size: .82rem;
      font-weight: 500;
      padding: 8px 18px;
      transition: opacity .15s, background .15s;
    }
    button:disabled { opacity: .45; cursor: not-allowed; }

    #btn-refresh { background: var(--accent); color: #111; }
    #btn-refresh:not(:disabled):hover { background: #dbbf86; }

    /* ── Main ────────────────────────────────────────────────────────────── */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 28px 20px 60px;
      display: flex;
      flex-direction: column;
      gap: 32px;
    }

    /* ── Spinner ─────────────────────────────────────────────────────────── */
    #spinner { display: none; text-align: center; padding: 60px 0; color: var(--muted); }
    #spinner.active { display: block; }

    .spin {
      display: inline-block;
      width: 36px; height: 36px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Global error ────────────────────────────────────────────────────── */
    #global-error {
      display: none;
      background: #2a0d0d;
      border: 1px solid var(--danger);
      border-radius: 6px;
      padding: 16px 20px;
      color: #e07070;
      font-size: .85rem;
    }

    /* ── Brand card ──────────────────────────────────────────────────────── */
    .brand-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }

    .brand-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      gap: 12px;
      flex-wrap: wrap;
    }

    .brand-name { font-size: 1rem; font-weight: 600; color: var(--accent); letter-spacing: .03em; }

    .brand-meta { display: flex; align-items: center; gap: 14px; }

    .badge {
      background: var(--accent2);
      color: #f0e0c0;
      border-radius: 12px;
      padding: 2px 10px;
      font-size: .75rem;
      font-weight: 600;
    }

    .brand-link { font-size: .78rem; color: var(--muted); text-decoration: none; }
    .brand-link:hover { color: var(--accent); }

    .brand-error { padding: 18px; color: #e07070; font-size: .82rem; background: #1c0a0a; }
    .brand-empty { padding: 24px 18px; color: var(--muted); font-size: .82rem; font-style: italic; }

    /* ── Table ───────────────────────────────────────────────────────────── */
    .table-wrap { overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    thead th {
      background: #1e1e1e;
      color: var(--muted);
      font-size: .72rem;
      font-weight: 600;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 9px 14px;
      text-align: left;
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    tbody tr { border-bottom: 1px solid var(--border); transition: background .1s; }
    tbody tr:last-child { border-bottom: none; }
    tbody tr:nth-child(even) { background: var(--row-alt); }
    tbody tr:hover { background: #212121; }
    tbody td { padding: 10px 14px; vertical-align: middle; font-size: .82rem; }

    .td-title { max-width: 380px; min-width: 180px; }

    .listing-link {
      color: var(--text);
      text-decoration: none;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }
    .listing-link:hover { color: var(--accent); text-decoration: underline; }

    .td-price { white-space: nowrap; color: var(--green); font-weight: 600; min-width: 80px; }
    .td-source { color: var(--muted); white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
    .td-date { color: var(--muted); white-space: nowrap; min-width: 90px; }

    .ext-icon { display: inline-block; margin-left: 4px; opacity: .45; font-size: .68rem; vertical-align: middle; }

    /* ── Footer ──────────────────────────────────────────────────────────── */
    footer {
      text-align: center;
      font-size: .72rem;
      color: var(--muted);
      padding: 20px;
      border-top: 1px solid var(--border);
    }
    footer a { color: var(--accent); }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>Watch Brand Aggregator</h1>
    <p>Listings from WatchRecon.com &mdash; auto-updated every 4 hours</p>
  </div>
  <div class="header-right">
    <span id="status-text">Loading…</span>
    <button id="btn-refresh">&#8635; Reload</button>
  </div>
</header>

<main>
  <div id="spinner">
    <div class="spin"></div>
    <p>Loading listings…</p>
  </div>
  <div id="global-error"></div>
  <div id="brands-container"></div>
</main>

<footer>
  Data sourced from <a href="https://www.watchrecon.com" target="_blank" rel="noopener">WatchRecon.com</a>.
  Refreshed automatically every 4 hours via GitHub Actions.
</footer>

<script>
  const btnRefresh = document.getElementById('btn-refresh');
  const statusText = document.getElementById('status-text');
  const spinner    = document.getElementById('spinner');
  const globalErr  = document.getElementById('global-error');
  const container  = document.getElementById('brands-container');

  function setLoading(on) {
    btnRefresh.disabled = on;
    spinner.classList.toggle('active', on);
    if (on) { container.innerHTML = ''; globalErr.style.display = 'none'; }
  }

  function showError(msg) {
    globalErr.textContent = '⚠ ' + msg;
    globalErr.style.display = 'block';
    statusText.textContent = 'Error';
  }

  function fmt(iso) {
    if (!iso) return '';
    try {
      return new Date(iso).toLocaleString(undefined, {
        month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
      });
    } catch { return iso; }
  }

  function esc(s) {
    return String(s || '')
      .replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render(data) {
    statusText.textContent = data.generatedAt
      ? 'Last updated ' + fmt(data.generatedAt)
      : 'Loaded';

    container.innerHTML = '';

    (data.brands || []).forEach(brand => {
      const card = document.createElement('div');
      card.className = 'brand-card';

      card.innerHTML = `
        <div class="brand-header">
          <span class="brand-name">${esc(brand.name)}</span>
          <div class="brand-meta">
            <span class="badge">${brand.count} listing${brand.count !== 1 ? 's' : ''}</span>
            <a class="brand-link" href="${esc(brand.url)}" target="_blank" rel="noopener">
              View on WatchRecon &#8599;
            </a>
          </div>
        </div>
      `;

      if (brand.error) {
        card.insertAdjacentHTML('beforeend',
          `<div class="brand-error">⚠ Scrape error: ${esc(brand.error)}</div>`);
      } else if (!brand.listings || !brand.listings.length) {
        card.insertAdjacentHTML('beforeend',
          `<div class="brand-empty">No listings found.</div>`);
      } else {
        const wrap = document.createElement('div');
        wrap.className = 'table-wrap';
        wrap.innerHTML = `
          <table>
            <thead><tr>
              <th>Title</th><th>Price</th><th>Source</th><th>Listed</th>
            </tr></thead>
            <tbody>
              ${brand.listings.map(l => `
                <tr>
                  <td class="td-title">
                    <a class="listing-link" href="${esc(l.url)}" target="_blank" rel="noopener">
                      ${esc(l.title)}<span class="ext-icon">&#8599;</span>
                    </a>
                  </td>
                  <td class="td-price">${esc(l.price)}</td>
                  <td class="td-source" title="${esc(l.source)}">${esc(l.source)}</td>
                  <td class="td-date">${esc(l.date)}</td>
                </tr>`).join('')}
            </tbody>
          </table>`;
        card.appendChild(wrap);
      }

      container.appendChild(card);
    });
  }

  async function load() {
    setLoading(true);
    try {
      // Cache-bust so the browser always fetches the latest committed data.json
      const res  = await fetch('./data.json?t=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      render(data);
    } catch (err) {
      showError(err.message);
    } finally {
      setLoading(false);
    }
  }

  btnRefresh.addEventListener('click', load);
  load();
</script>
</body>
</html>
